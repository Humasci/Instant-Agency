<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SIX3 Agency</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 12px;
        }
        
        .header p {
            color: #666;
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .form-grid {
            display: grid;
            gap: 20px;
            grid-template-columns: 1fr 1fr;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
        }
        
        .form-group.full-width {
            grid-column: span 2;
        }
        
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95rem;
        }
        
        input, select, textarea {
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-item input[type="checkbox"] {
            width: auto;
            margin: 0;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 16px 32px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 24px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.3);
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .message {
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }
        
        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f1b0b7;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .back-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-4px);
        }
        
        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .form-group.full-width {
                grid-column: span 1;
            }
            
            .container {
                padding: 16px;
            }
            
            .header, .form-container {
                padding: 24px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Back to Dashboard</a>
        
        <div class="header">
            <h1>Get In Touch</h1>
            <p>Ready to transform your business with AI? Let's discuss your needs and create a custom solution that drives real results.</p>
        </div>
        
        <div class="form-container">
            <div id="message-container"></div>
            
            <form id="contact-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="company">Company Name</label>
                        <input type="text" id="company" name="company">
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="website">Website</label>
                        <input type="url" id="website" name="website" placeholder="https://yourcompany.com">
                    </div>
                    
                    <div class="form-group full-width">
                        <label>Services Interested In *</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input type="checkbox" id="lead-gen" name="services" value="AI Lead Generation & Qualification">
                                <label for="lead-gen">AI Lead Generation & Qualification</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="marketing" name="services" value="Automated Marketing Campaigns">
                                <label for="marketing">Automated Marketing Campaigns</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="content" name="services" value="AI Content & Video Production">
                                <label for="content">AI Content & Video Production</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="customer-service" name="services" value="AI Customer Service">
                                <label for="customer-service">AI Customer Service</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="analytics" name="services" value="Business Intelligence & Analytics">
                                <label for="analytics">Business Intelligence & Analytics</label>
                            </div>
                            <div class="checkbox-item">
                                <input type="checkbox" id="automation" name="services" value="Process Automation">
                                <label for="automation">Process Automation</label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="budget">Budget Range</label>
                        <select id="budget" name="budget" required>
                            <option value="">Select Budget Range</option>
                            <option value="$5K - $15K">$5K - $15K</option>
                            <option value="$15K - $50K">$15K - $50K</option>
                            <option value="$50K - $100K">$50K - $100K</option>
                            <option value="$100K+">$100K+</option>
                            <option value="Let's discuss">Let's discuss</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="timeline">Project Timeline</label>
                        <select id="timeline" name="timeline" required>
                            <option value="">Select Timeline</option>
                            <option value="ASAP (1-2 weeks)">ASAP (1-2 weeks)</option>
                            <option value="1-3 months">1-3 months</option>
                            <option value="3-6 months">3-6 months</option>
                            <option value="6+ months">6+ months</option>
                            <option value="Just exploring">Just exploring</option>
                        </select>
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="pain-points">Current Business Challenges *</label>
                        <textarea id="pain-points" name="painPoints" placeholder="What specific challenges is your business facing that AI could help solve?" required></textarea>
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="goals">Business Goals *</label>
                        <textarea id="goals" name="goals" placeholder="What are your main business objectives for the next 6-12 months?" required></textarea>
                    </div>
                    
                    <div class="form-group full-width">
                        <label for="message">Additional Information</label>
                        <textarea id="message" name="message" placeholder="Anything else you'd like us to know about your project or requirements?"></textarea>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn" id="submit-btn">
                    Send Message
                </button>
            </form>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('contact-form');
        const submitBtn = document.getElementById('submit-btn');
        const messageContainer = document.getElementById('message-container');
        
        function showMessage(text, type) {
            messageContainer.innerHTML = `<div class="message ${type}">${text}</div>`;
            messageContainer.scrollIntoView({ behavior: 'smooth' });
        }
        
        function clearMessage() {
            messageContainer.innerHTML = '';
        }
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            clearMessage();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            
            try {
                // Get form data
                const formData = new FormData(form);
                const data = {};
                
                // Convert form data to object
                for (let [key, value] of formData.entries()) {
                    if (data[key]) {
                        // Handle multiple values (checkboxes)
                        if (Array.isArray(data[key])) {
                            data[key].push(value);
                        } else {
                            data[key] = [data[key], value];
                        }
                    } else {
                        data[key] = value;
                    }
                }
                
                // Get selected services
                const servicesCheckboxes = document.querySelectorAll('input[name="services"]:checked');
                data.services = Array.from(servicesCheckboxes).map(cb => cb.value);
                
                // Validate required fields
                if (!data.name || !data.email || !data.painPoints || !data.goals || data.services.length === 0) {
                    showMessage('Please fill in all required fields.', 'error');
                    return;
                }
                
                // Send to API
                const response = await fetch('https://six3-back-d29vg9r6x-humascis-projects.vercel.app/api/contact', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    showMessage('Thank you! Your message has been sent successfully. We\'ll get back to you within 24 hours.', 'success');
                    form.reset();
                } else {
                    throw new Error(result.message || 'Something went wrong. Please try again.');
                }
                
            } catch (error) {
                console.error('Form submission error:', error);
                showMessage(`Error: ${error.message}. Please try again or contact us directly.`, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Message';
            }
        });
    </script>
</body>
</html>
