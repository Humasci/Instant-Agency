version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: instant-agency-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-instant_agency}
      POSTGRES_USER: ${POSTGRES_USER:-instant_agency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-instant_agency}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - instant-agency-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: instant-agency-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - instant-agency-network

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: instant-agency-n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-instant_agency}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-instant_agency}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=${N8N_HOST:-0.0.0.0}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
      - GENERIC_TIMEZONE=${TZ:-America/New_York}
      - N8N_EXECUTION_MODE=${N8N_EXECUTION_MODE:-regular}
      - EXECUTIONS_TIMEOUT=${EXECUTIONS_TIMEOUT:-3600}
      - EXECUTIONS_TIMEOUT_MAX=${EXECUTIONS_TIMEOUT_MAX:-7200}
      # Agent API URL (accessible from n8n container)
      - AGENT_API_URL=${AGENT_API_URL:-http://agent-service:8000}
      # Attio CRM API key
      - ATTIO_API_KEY=${ATTIO_API_KEY}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-service:
        condition: service_started
    networks:
      - instant-agency-network

  # Metabase Analytics
  metabase:
    image: metabase/metabase:latest
    container_name: instant-agency-metabase
    restart: unless-stopped
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=${METABASE_DB:-metabase}
      - MB_DB_PORT=5432
      - MB_DB_USER=${POSTGRES_USER:-instant_agency}
      - MB_DB_PASS=${POSTGRES_PASSWORD:-changeme}
      - MB_DB_HOST=postgres
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - instant-agency-network

  # AI Agent Service
  agent-service:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: instant-agency-agents
    restart: unless-stopped
    environment:
      # Hugging Face API
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}

      # Attio CRM
      - ATTIO_API_KEY=${ATTIO_API_KEY}

      # Database
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-instant_agency}
      - POSTGRES_USER=${POSTGRES_USER:-instant_agency}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}

      # Redis
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}

      # Phase 4 External APIs (optional)
      - DID_API_KEY=${DID_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION}

      # Service config
      - AGENT_SERVICE_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    volumes:
      - ./agents:/app/agents
      - ./integrations:/app/integrations
      - agent_logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - instant-agency-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Prometheus Monitoring (optional - can be disabled)
  prometheus:
    image: prom/prometheus:latest
    container_name: instant-agency-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - instant-agency-network
    profiles:
      - monitoring

  # Grafana Dashboards (optional - can be disabled)
  grafana:
    image: grafana/grafana:latest
    container_name: instant-agency-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_INSTALL_PLUGINS=redis-datasource,postgres-datasource
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
      - postgres
    networks:
      - instant-agency-network
    profiles:
      - monitoring

networks:
  instant-agency-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
  metabase_data:
    driver: local
  agent_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
