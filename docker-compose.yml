version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: instant-agency-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-instant_agency}
      POSTGRES_USER: ${POSTGRES_USER:-instant_agency}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/migrations:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-instant_agency}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - instant-agency-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: instant-agency-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - instant-agency-network

  # n8n Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: instant-agency-n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-instant_agency}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-instant_agency}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=${N8N_HOST:-0.0.0.0}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678}
      - GENERIC_TIMEZONE=${TZ:-America/New_York}
      - N8N_EXECUTION_MODE=${N8N_EXECUTION_MODE:-regular}
      - EXECUTIONS_TIMEOUT=${EXECUTIONS_TIMEOUT:-3600}
      - EXECUTIONS_TIMEOUT_MAX=${EXECUTIONS_TIMEOUT_MAX:-7200}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - instant-agency-network

  # SuiteCRM
  suitecrm:
    image: bitnami/suitecrm:latest
    container_name: instant-agency-crm
    restart: unless-stopped
    environment:
      - SUITECRM_DATABASE_HOST=postgres
      - SUITECRM_DATABASE_PORT_NUMBER=5432
      - SUITECRM_DATABASE_NAME=${CRM_DB_NAME:-suitecrm}
      - SUITECRM_DATABASE_USER=${POSTGRES_USER:-instant_agency}
      - SUITECRM_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - SUITECRM_USERNAME=${CRM_USERNAME:-admin}
      - SUITECRM_PASSWORD=${CRM_PASSWORD:-changeme}
      - SUITECRM_EMAIL=${CRM_EMAIL:-admin@instant-agency.ai}
      - SUITECRM_HOST=${CRM_HOST:-localhost:8080}
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - suitecrm_data:/bitnami/suitecrm
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - instant-agency-network

  # Metabase Analytics
  metabase:
    image: metabase/metabase:latest
    container_name: instant-agency-metabase
    restart: unless-stopped
    environment:
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=${METABASE_DB:-metabase}
      - MB_DB_PORT=5432
      - MB_DB_USER=${POSTGRES_USER:-instant_agency}
      - MB_DB_PASS=${POSTGRES_PASSWORD:-changeme}
      - MB_DB_HOST=postgres
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - instant-agency-network

  # Chroma Vector Database
  chroma:
    image: ghcr.io/chroma-core/chroma:latest
    container_name: instant-agency-chroma
    restart: unless-stopped
    environment:
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=${CHROMA_AUTH_PROVIDER:-chromadb.auth.token.TokenAuthServerProvider}
      - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_AUTH_TOKEN:-changeme}
      - CHROMA_SERVER_AUTH_TOKEN_TRANSPORT_HEADER=${CHROMA_AUTH_HEADER:-X-Chroma-Token}
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - instant-agency-network

  # AI Agent Service
  agent-service:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: instant-agency-agents
    restart: unless-stopped
    environment:
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-instant_agency}
      - POSTGRES_USER=${POSTGRES_USER:-instant_agency}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - ./agents:/app/agents
      - ./models:/app/models
      - agent_logs:/app/logs
    depends_on:
      - postgres
      - redis
      - chroma
    networks:
      - instant-agency-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: instant-agency-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - instant-agency-network

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: instant-agency-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_INSTALL_PLUGINS=redis-datasource,postgres-datasource
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
      - postgres
    networks:
      - instant-agency-network

networks:
  instant-agency-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
  suitecrm_data:
    driver: local
  metabase_data:
    driver: local
  chroma_data:
    driver: local
  agent_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
