# SIX3 Agency Production Deployment Configuration

api:
  production_url: "https://api.six3agency.com"
  staging_url: "https://staging-api.six3agency.com"
  development_url: "http://localhost:8000"
  
  endpoints:
    # Search Marketing Expert
    - path: "/agents/campaign-strategy/analyze"
      method: "POST"
      description: "Campaign strategy analysis for search marketing"
    
    - path: "/agents/competitor-analysis/research"
      method: "POST"
      description: "Competitive intelligence and market research"
    
    - path: "/agents/bid-optimization/create-campaigns"
      method: "POST"
      description: "Bid optimization and campaign creation"
    
    # AI Media Expert
    - path: "/agents/digital-avatar/analyze-requirements"
      method: "POST"
      description: "Analyze avatar creation requirements"
    
    - path: "/agents/voice-conversation/clone-voice"
      method: "POST"
      description: "Voice cloning and synthesis"
    
    - path: "/agents/digital-avatar/create-avatar"
      method: "POST"
      description: "AI avatar generation and customization"
    
    - path: "/agents/video-content-generator/produce"
      method: "POST"
      description: "Video content generation with AI avatars"
    
    - path: "/agents/ugc-campaign-manager/create-campaign"
      method: "POST"
      description: "UGC campaign creation and management"
    
    # ML/AI Expert
    - path: "/agents/data-processing/analyze-dataset"
      method: "POST"
      description: "Dataset analysis and validation"
    
    - path: "/agents/data-processing/enhance-dataset"
      method: "POST"
      description: "Dataset enhancement and preprocessing"
    
    - path: "/agents/model-training/select-architecture"
      method: "POST"
      description: "Model architecture selection and optimization"
    
    - path: "/agents/model-training/fine-tune"
      method: "POST"
      description: "Model fine-tuning execution"
    
    - path: "/agents/performance-evaluation/validate-model"
      method: "POST"
      description: "Model performance validation and testing"
    
    - path: "/agents/deployment-orchestrator/deploy-model"
      method: "POST"
      description: "Production model deployment"
    
    # Lead Management
    - path: "/agents/prospect-research/process"
      method: "POST"
      description: "Lead qualification and prospect research"
    
    - path: "/agents/sales-pitch/generate"
      method: "POST"
      description: "Personalized sales pitch generation"
    
    - path: "/agents/email-personalizer/create"
      method: "POST"
      description: "Email personalization and automation"
    
    # Client Onboarding
    - path: "/agents/rag-research/analyze-client"
      method: "POST"
      description: "Client analysis and research using RAG"

infrastructure:
  cloud_provider: "AWS"
  regions:
    primary: "us-east-1"
    backup: "us-west-2"
  
  services:
    api_gateway: 
      service: "AWS API Gateway"
      custom_domain: "api.six3agency.com"
      ssl_certificate: "AWS Certificate Manager"
    
    compute:
      service: "AWS ECS Fargate"
      auto_scaling: true
      min_instances: 2
      max_instances: 10
    
    database:
      service: "AWS RDS PostgreSQL"
      multi_az: true
      backup_retention: 30
    
    storage:
      work_products: "AWS S3"
      encryption: "AES-256"
      versioning: true
    
    monitoring:
      service: "AWS CloudWatch"
      log_retention: 90
      alerts: true

n8n_deployment:
  cloud_provider: "n8n Cloud"
  instance_type: "Pro"
  custom_domain: "workflows.six3agency.com"
  
  webhook_urls:
    lead_qualification: "https://workflows.six3agency.com/webhook/six3-lead-qualification"
    search_marketing: "https://workflows.six3agency.com/webhook/six3-search-marketing"
    ai_avatar: "https://workflows.six3agency.com/webhook/six3-avatar-production"
    ml_tuning: "https://workflows.six3agency.com/webhook/six3-ml-tuning"
    email_personalization: "https://workflows.six3agency.com/webhook/six3-email-personalization"
    client_onboarding: "https://workflows.six3agency.com/webhook/six3-client-onboarding"
    ai_video: "https://workflows.six3agency.com/webhook/six3-generative-ai-media"

security:
  api_authentication: "JWT tokens"
  rate_limiting: "100 requests/minute per client"
  ip_whitelisting: "n8n Cloud IPs only"
  data_encryption: "TLS 1.3 in transit, AES-256 at rest"
  compliance: ["SOC 2", "GDPR", "HIPAA-ready"]

deployment_checklist:
  - "✅ Update all n8n workflow URLs to production endpoints"
  - "⏳ Deploy FastAPI server to AWS ECS"
  - "⏳ Configure AWS API Gateway with custom domain"
  - "⏳ Set up RDS PostgreSQL database with schema"
  - "⏳ Configure S3 bucket for work product storage"
  - "⏳ Deploy n8n workflows to n8n Cloud"
  - "⏳ Set up monitoring and alerting"
  - "⏳ Configure SSL certificates"
  - "⏳ Test all workflow endpoints"
  - "⏳ Set up backup and disaster recovery"